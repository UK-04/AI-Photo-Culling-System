name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: ./scripts/fetch_models.sh
      - run: pip install -e "engine[dev]"
      - run: ruff check engine
      - run: cd engine && pytest

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - run: cd app && npm ci && npm run typecheck && npm test && npm run build
      # Compiles the Rust shell. The sidecar is stubbed: this job checks code, it does not package.
      - run: |
          mkdir -p app/src-tauri/binaries/culler-engine-dist
          touch app/src-tauri/binaries/culler-engine-dist/placeholder
          printf '#!/bin/sh\n' > "app/src-tauri/binaries/culler-engine-$(rustc -vV | sed -n 's/^host: //p')"
          chmod +x app/src-tauri/binaries/culler-engine-*
          cd app/src-tauri && cargo check
