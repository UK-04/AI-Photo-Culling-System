[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "culler"
version = "0.2.0"
description = "Local photo-culling engine: technical analysis, burst grouping, rule scoring and a personal taste model."
requires-python = ">=3.11"
# Minimum versions. The test suite was run on Python 3.13 with numpy 2.5, OpenCV 5.0,
# Pillow 12.3, scikit-learn 1.9, mediapipe 0.10.32; older versions back to these floors
# install on Python 3.11 and 3.12.
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10.1",
  "pillow-heif>=0.16",
  "rawpy>=0.21",
  "xxhash>=3.4",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "mediapipe>=0.10.14",
]

[project.optional-dependencies]
# CLIP embeddings. Without this extra the engine uses its built-in fallback descriptor.
clip = ["torch>=2.2", "open_clip_torch>=2.24"]
dev = ["pytest>=8", "httpx>=0.27", "ruff", "mypy"]
build = ["pyinstaller"]

[project.scripts]
culler = "culler.cli:main"

[tool.setuptools.packages.find]
include = ["culler*"]

[tool.setuptools.package-data]
culler = ["db/migrations/*.sql", "assets/models/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
